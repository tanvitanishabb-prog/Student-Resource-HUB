<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Student Resource Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
  <header class="site-header"><nav id="nav" class="nav"></nav></header>
  <main class="wrap">
    <section class="card narrow">
      <h1>Create your account</h1>
      <form id="registerForm" class="form">
        <label>Full name <input type="text" name="name" required></label>
        <label>Email <input type="email" name="email" required></label>
        <label>Course <input type="text" name="course" placeholder="e.g. BBA"></label>
        <label>Password <input type="password" name="password" minlength="8" required></label>
        <p class="hint">At least 8 characters.</p>
        <button type="submit" class="btn">Create account</button>
        <p id="msg" class="msg" role="status"></p>
      </form>
      <p class="hint">Already registered? <a href="login.html">Log in</a></p>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
